<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xi Lin - Product Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col dark:bg-stone-950 dark:text-stone-100 font-['Inter']">

    <nav class="fixed top-0 left-0 w-full z-50 bg-white/90 dark:bg-stone-950/90 backdrop-blur-md pt-8 pb-6 px-6 md:px-24 flex justify-between items-center transition-all duration-300 border-b border-transparent hover:border-stone-100 dark:hover:border-stone-800">
        <div class="text-xl font-bold text-stone-900 dark:text-stone-100 cursor-pointer tracking-tight hover:text-[var(--theme-accent)] transition-colors" id="nav-logo">
            Xi Lin<span class="text-[var(--theme-accent)]">.</span>
        </div>
        <div class="flex items-center gap-6 md:gap-10 text-xs font-bold uppercase tracking-widest text-stone-400 dark:text-stone-500">
            <button class="nav-btn hover:text-[var(--theme-accent)] transition-colors" data-page="work">Work</button>
            <button class="nav-btn hover:text-[var(--theme-accent)] transition-colors" data-page="experiments">Experiments</button>
            <button class="nav-btn hover:text-[var(--theme-accent)] transition-colors" data-page="about">About</button>

            <div class="w-px h-4 bg-stone-200 dark:bg-stone-800"></div>

            <a href="/resume.pdf" target="_blank" class="px-3 py-1 border border-stone-200 dark:border-stone-800 rounded-full text-[10px] text-stone-400 dark:text-stone-500 hover:text-[var(--theme-accent)] hover:border-[var(--theme-accent)] transition-all">
                Resume
            </a>

            <button id="theme-toggle" class="text-stone-400 hover:text-[var(--theme-accent)] transition-colors focus:outline-none ml-2">
                <span class="dark:hidden"><i data-lucide="moon" class="w-4 h-4"></i></span>
                <span class="hidden dark:block"><i data-lucide="sun" class="w-4 h-4"></i></span>
            </button>
        </div>
    </nav>

    <main id="app-root" class="flex-grow pt-32 relative"></main>

    <footer class="w-full py-20 border-t border-stone-100 dark:border-stone-900 mt-auto bg-white dark:bg-stone-950">
        <div class="max-w-5xl mx-auto px-6 md:px-12 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <h4 class="text-sm font-bold text-stone-900 dark:text-stone-100 mb-2">Xi Lin</h4>
                <p class="text-xs text-stone-400 dark:text-stone-600 uppercase tracking-widest">Product Designer © 2024</p>
            </div>
            <div class="flex gap-8">
                <a href="#" class="group flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-stone-500 dark:text-stone-500 hover:text-[var(--theme-accent)] transition-colors"><i data-lucide="linkedin" class="w-4 h-4"></i> LinkedIn</a>
                <a href="#" class="group flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-stone-500 dark:text-stone-500 hover:text-[var(--theme-accent)] transition-colors"><i data-lucide="mail" class="w-4 h-4"></i> Email</a>
                <a href="#" class="group flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-stone-500 dark:text-stone-500 hover:text-[var(--theme-accent)] transition-colors"><i data-lucide="github" class="w-4 h-4"></i> GitHub</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>

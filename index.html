<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xi Lin - Product Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col dark:bg-stone-950 dark:text-stone-100 font-['Inter']">

    <nav class="fixed top-0 left-0 w-full z-50 bg-white/90 dark:bg-stone-950/90 backdrop-blur-md pt-8 pb-6 px-6 md:px-24 flex justify-between items-center transition-all duration-300 border-b border-transparent hover:border-stone-100 dark:hover:border-stone-800">
        <div class="text-xl font-bold text-stone-900 dark:text-stone-100 cursor-pointer tracking-tight hover:text-retro-red dark:hover:text-bright-yellow transition-colors" id="nav-logo">
            Xi Lin<span class="text-theme-accent">.</span>
        </div>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center gap-10 text-xs font-bold uppercase tracking-widest text-stone-400 dark:text-stone-500">
            <button class="nav-btn hover:text-retro-red dark:hover:text-bright-yellow transition-colors" data-page="work">Work</button>
            <button class="nav-btn hover:text-retro-red dark:hover:text-bright-yellow transition-colors" data-page="experiments">Experiments</button>
            <button class="nav-btn hover:text-retro-red dark:hover:text-bright-yellow transition-colors" data-page="about">About</button>

            <div class="w-px h-4 bg-stone-200 dark:bg-stone-800"></div>

            <a href="/resume.pdf" target="_blank" class="px-3 py-1 border border-stone-200 dark:border-stone-800 rounded-full text-[10px] text-stone-400 dark:text-stone-500 hover:text-retro-red dark:hover:text-bright-yellow hover:border-retro-red dark:hover:border-bright-yellow transition-all">
                Resume
            </a>

            <button class="theme-toggle-btn text-stone-400 hover:text-retro-red dark:hover:text-bright-yellow transition-colors focus:outline-none ml-2">
                <span class="dark:hidden"><i data-lucide="moon" class="w-4 h-4"></i></span>
                <span class="hidden dark:block"><i data-lucide="sun" class="w-4 h-4"></i></span>
            </button>
        </div>

        <!-- Mobile Menu Button -->
        <button id="mobile-menu-btn" class="md:hidden text-stone-900 dark:text-stone-100 hover:text-retro-red dark:hover:text-bright-yellow transition-colors">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </nav>

    <!-- Mobile Menu Overlay (Moved outside nav to avoid stacking context issues) -->
    <div id="mobile-menu" class="fixed inset-0 z-[100] bg-white dark:bg-stone-950 opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Close Button -->
        <button id="close-menu-btn" class="absolute top-8 right-6 z-20 text-stone-900 dark:text-stone-100 hover:text-retro-red dark:hover:text-bright-yellow transition-colors">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>

        <!-- Scrollable Content Container -->
        <div class="absolute inset-0 overflow-y-auto">
            <div class="min-h-full flex flex-col items-center justify-center gap-8 py-24">
                <button class="nav-btn mobile-nav-link text-lg font-bold uppercase tracking-widest text-stone-900 dark:text-stone-100 hover:text-retro-red dark:hover:text-bright-yellow transition-colors" data-page="work">Work</button>
                <button class="nav-btn mobile-nav-link text-lg font-bold uppercase tracking-widest text-stone-900 dark:text-stone-100 hover:text-retro-red dark:hover:text-bright-yellow transition-colors" data-page="experiments">Experiments</button>
                <button class="nav-btn mobile-nav-link text-lg font-bold uppercase tracking-widest text-stone-900 dark:text-stone-100 hover:text-retro-red dark:hover:text-bright-yellow transition-colors" data-page="about">About</button>
                
                <a href="/resume.pdf" target="_blank" class="px-6 py-2 border border-stone-200 dark:border-stone-800 rounded-full text-xs font-bold uppercase tracking-widest text-stone-400 dark:text-stone-500 hover:text-retro-red dark:hover:text-bright-yellow hover:border-retro-red dark:hover:border-bright-yellow transition-all">
                    Resume
                </a>

                <button class="theme-toggle-btn text-stone-400 hover:text-retro-red dark:hover:text-bright-yellow transition-colors focus:outline-none mt-2">
                    <span class="dark:hidden flex items-center gap-2 text-xs font-bold uppercase tracking-widest"><i data-lucide="moon" class="w-5 h-5"></i> Dark Mode</span>
                    <span class="hidden dark:flex items-center gap-2 text-xs font-bold uppercase tracking-widest"><i data-lucide="sun" class="w-5 h-5"></i> Light Mode</span>
                </button>
            </div>
        </div>
    </div>

    <main id="app-root" class="flex-grow pt-32 relative"></main>

    <footer class="w-full py-20 border-t border-stone-100 dark:border-stone-900 mt-auto bg-white dark:bg-stone-950">
        <div class="max-w-5xl mx-auto px-6 md:px-12 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <h4 class="text-sm font-bold text-stone-900 dark:text-stone-100 mb-2">Xi Lin</h4>
                <p class="text-xs text-stone-400 dark:text-stone-600 uppercase tracking-widest">Product Designer © 2024</p>
            </div>
            <div class="flex gap-8">
                <a href="#" class="group flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-stone-500 dark:text-stone-500 hover:text-retro-red dark:hover:text-bright-yellow transition-colors"><i data-lucide="linkedin" class="w-4 h-4"></i> LinkedIn</a>
                <a href="#" class="group flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-stone-500 dark:text-stone-500 hover:text-retro-red dark:hover:text-bright-yellow transition-colors"><i data-lucide="mail" class="w-4 h-4"></i> Email</a>
                <a href="#" class="group flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-stone-500 dark:text-stone-500 hover:text-retro-red dark:hover:text-bright-yellow transition-colors"><i data-lucide="github" class="w-4 h-4"></i> GitHub</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
